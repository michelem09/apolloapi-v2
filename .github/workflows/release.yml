name: release

# Builds the signed release artifact for OTA updates. Everything runs on an ARM
# runner because the backend has native dependencies (sqlite3) that must be
# compiled for the device's aarch64 ABI — an x86 build would produce a tarball
# that cannot start.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), for dry runs off a tag'
        required: true

permissions:
  contents: write   # create the Release and upload assets
  id-token: write   # OIDC token for cosign keyless signing

# One release at a time, PER TAG — not one release at a time overall.
#
# A shared group does not serialise: GitHub keeps at most one pending run per
# group and cancels the previous pending one when a new run arrives, and
# cancel-in-progress only protects the run already executing. Three tags pushed
# within a few minutes — shipping a fix on top of a fix, which is this branch's
# actual working pattern — meant the middle one was cancelled outright: no
# tarball, no signature, no manifest, no Release, and no alert either, because a
# cancelled run is not a failed run. The tag existed in git with nothing behind
# it.
#
# Keyed on the ref, every release runs. What the shared group was reaching for —
# the channel pointer is uploaded with --clobber, so two releases finishing out
# of order could leave the channel pointing BACKWARDS, and a device on the newer
# release then refuses to install it ("refusing to move to older/equal") — is
# handled where it belongs, in the pointer step itself, which now refuses to
# move the channel to an older version.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The one place that decides what counts as an official build.
  OFFICIAL_OWNER: jstefanop

jobs:
  release:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false   # .gitmodules points upstream on purpose; resolved below
          fetch-depth: 0

      - name: Resolve the UI submodule from this repo's owner
        # .gitmodules stays pinned to the upstream repo so a fork URL is never
        # proposed upstream. Overriding it locally makes the build work unchanged
        # on a fork and on the official repo.
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          git config submodule.apolloui-v2.url "https://github.com/${OWNER}/apolloui-v2.git"
          git submodule update --init --depth 1
          git -C apolloui-v2 log --oneline -1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # must match the device ABI for sqlite3

      - name: Derive version, channel and tag
        id: meta
        # Every value below is read from env, never interpolated into the script
        # body: `${{ }}` is substituted textually before bash parses the line, and
        # git happily allows backticks, `$`, `;` and quotes in a tag name.
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi

          # Strict gate. Everything downstream — shell, JSON, the tag we publish
          # to — is derived from VERSION, so validating it once here is what makes
          # the rest safe, and a malformed tag fails the build instead of running.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.]*)?$'; then
            echo "refusing version '$VERSION' — expected 1.2.3 or 1.2.3-rc1" >&2
            exit 1
          fi

          # Artifacts built anywhere other than the official repo are always 'dev'.
          # A fork signs with a different keyless identity, so this keeps a fork
          # build from presenting itself as something a production device accepts.
          if [ "$OWNER" != "$OFFICIAL_OWNER" ]; then
            CHANNEL=dev
          elif printf '%s' "$VERSION" | grep -qiE '(-rc|-beta|-alpha)'; then
            CHANNEL=beta
          else
            CHANNEL=stable
          fi

          # One-line summary for the "update available" row in the UI. Comes from
          # the annotated tag so it is written deliberately when cutting a
          # release, rather than improvised from a commit subject.
          #
          # actions/checkout rewrites refs/tags/<tag> to point straight at the
          # commit (`fetch +<sha>:refs/tags/<tag>`), which quietly degrades an
          # annotated tag to a lightweight one — %(contents:subject) then returns
          # the commit subject, which reads plausibly and is the wrong text. Fetch
          # the tag object back and only trust it if it really is one.
          SUMMARY=""
          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}" 2>/dev/null || true
          if [ "$(git cat-file -t "v${VERSION}" 2>/dev/null)" = "tag" ]; then
            SUMMARY=$(git tag -l --format='%(contents:subject)' "v${VERSION}")
          fi
          [ -n "$SUMMARY" ] || SUMMARY="Apollo ${VERSION}"

          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "tag=v${VERSION}"          # derived, never the raw ref
            echo "tarball=apollo-${VERSION}-aarch64.tar.zst"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "summary=$SUMMARY"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION on channel $CHANNEL"

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile
          yarn --cwd apolloui-v2 install --frozen-lockfile --ignore-engines

      - name: Test
        # A signature attests provenance, not that the code works. Refusing to
        # publish a failing build is the only thing standing between a bad commit
        # and a signed artifact the fleet would happily install.
        run: |
          yarn test
          yarn --cwd apolloui-v2 test

      - name: Build the UI
        # postbuild (scripts/assemble-standalone.sh) folds in .next/static, public
        # and the .env symlink.
        run: yarn --cwd apolloui-v2 build

      - name: Prune to production dependencies
        run: yarn install --frozen-lockfile --production

      - name: Stage the release tree
        id: stage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          set -Eeuo pipefail
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/apolloui-v2/.next"

          cp -r src config migrations knexfile.js package.json node_modules "$STAGE/"

          # Keep the nesting: apollo-ui-v2.service runs
          # `node .next/standalone/server.js` relative to the UI root, and
          # OTA_UPDATE_REDESIGN.md §2.3 documents this same layout. Flattening it
          # here would leave the unit looking for a server.js that is one level up.
          # static/ and public/ already live inside standalone (postbuild), so
          # copying them again would nest them a second time.
          cp -r apolloui-v2/.next/standalone "$STAGE/apolloui-v2/.next/standalone"

          # backend/ carries the launch scripts, systemd units, the small
          # miner/ckpool binaries — and bitcoind.
          #
          # bitcoind used to be excluded to keep the tarball small, and carried
          # across the swap from whatever the device already had. But the LIST of
          # selectable flavours travels in the release (the GraphQL enum, the UI
          # picker, node_start.sh), so a device imaged before core-31.0 existed
          # would take an update, be offered Core 31.0 in Settings, and get a
          # node.service that crash-loops on "executable not found" with no way
          # out from the UI. Only step 6 — bitcoind as its own on-demand package —
          # makes excluding it safe, and shipping the updater before that would
          # leave customers exactly there.
          #
          # x86_64 is dropped: devices are aarch64, and it is more than half the
          # weight (111 MB of 214 MB).
          mkdir -p "$STAGE/backend"
          tar -C backend --exclude='node/bin/*/x86_64' -cf - . | tar -C "$STAGE/backend" -xf -

          # Materialize the miner/ckpool runtime binaries the launch scripts call.
          # They are install-time artifacts copied from bin/<arch>/, not tracked
          # files, so without this the artifact ships the scripts without the
          # binaries. They are small (~6 MB), so shipping them keeps the device's
          # backend/ fully owned by the release — only bitcoind is inherited.
          m="$STAGE/backend/apollo-miner"
          install -m 755 "$m/bin/aarch64/apollo-miner"    "$m/futurebit-miner"
          install -m 755 "$m/bin/aarch64/apollo-miner-v2" "$m/futurebit-miner-v2"
          install -m 755 "$m/bin/aarch64/apollo-helper"   "$m/apollo-helper"
          install -m 755 "$STAGE/backend/ckpool/bin/aarch64/ckpool" "$STAGE/backend/ckpool/ckpool"

          # These arrive with steps 4 and 5; included automatically once they exist.
          [ -f bin/apollo-update ] && install -Dm755 bin/apollo-update "$STAGE/bin/apollo-update" || true
          [ -f bootstrap.sh ]      && install -Dm755 bootstrap.sh      "$STAGE/bootstrap.sh"      || true

          # jq, not a heredoc: routing values through env: protects against shell
          # metacharacters but not against a quote landing inside a JSON string.
          jq -n \
            --arg version "$VERSION" \
            --arg git_sha "$GITHUB_SHA" \
            --arg build_time "$BUILD_TIME" \
            --arg channel "$CHANNEL" \
            '{version: $version, git_sha: $git_sha, build_time: $build_time, channel: $channel}' \
            > "$STAGE/version.json"

          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          du -sh "$STAGE"

      - name: Pack and hash
        id: pack
        env:
          STAGE: ${{ steps.stage.outputs.stage }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          set -Eeuo pipefail
          tar -C "$STAGE" --zstd -cf "$TARBALL" .
          SHA=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$TARBALL")
          echo "sha256=$SHA"  >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"   >> "$GITHUB_OUTPUT"
          echo "$TARBALL: $((SIZE/1024/1024)) MB, sha256 $SHA"

      # Pinned, and deliberately the same version devices install via
      # backend/utils/install-update-deps.sh. Left floating, the signing side
      # drifts while the verifying side stays fixed on hardware nobody upgrades.
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.5.2

      - name: Sign the artifact (keyless)
        env:
          TARBALL: ${{ steps.meta.outputs.tarball }}
        run: |
          # Keyless: the signature is bound to this repo+workflow identity via OIDC,
          # so there is no key to store or rotate. The verifier on the device must
          # pin the expected identity per channel.
          cosign sign-blob --yes \
            --output-signature "${TARBALL}.sig" \
            --output-certificate "${TARBALL}.pem" \
            "$TARBALL"

      - name: Generate the manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
          SUMMARY: ${{ steps.meta.outputs.summary }}
          SHA: ${{ steps.pack.outputs.sha256 }}
          SIZE: ${{ steps.pack.outputs.size }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -Eeuo pipefail
          # Built from the derived TAG, which is also what the release is published
          # to — using the raw ref here made manual dispatch emit a manifest whose
          # URLs pointed at a tag that was never created.
          BASE="${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}"

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            --arg min_from "2.1.0" \
            --arg url "${BASE}/${TARBALL}" \
            --arg sig "${BASE}/${TARBALL}.sig" \
            --arg cert "${BASE}/${TARBALL}.pem" \
            --arg issuer "https://token.actions.githubusercontent.com" \
            --arg repository "$REPOSITORY" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg git_sha "$GITHUB_SHA" \
            --arg build_time "$BUILD_TIME" \
            --arg summary "$SUMMARY" \
            --arg notes_url "${SERVER_URL}/${REPOSITORY}/releases/tag/${TAG}" \
            '{version: $version, channel: $channel, sha256: $sha256, size: $size,
              min_from_version: $min_from, url: $url, signature_url: $sig,
              certificate_url: $cert,
              summary: $summary, notes_url: $notes_url,
              signing_identity: {issuer: $issuer, repository: $repository,
                                 workflow_ref: $workflow_ref},
              git_sha: $git_sha, build_time: $build_time}' \
            > "apollo-${VERSION}-manifest.json"

          # The channel manifest is what a device actually polls. The per-version
          # file above is useless for discovery: you must already know the version
          # to fetch it. Same content, published at a stable well-known URL.
          cp "apollo-${VERSION}-manifest.json" "${CHANNEL}.json"

          cat "apollo-${VERSION}-manifest.json"

      - name: Publish the Release
        # Tag pushes only, exactly like the channel step below. Without this a
        # workflow_dispatch dry run created the git tag at the branch head plus a
        # public Release — and `gh release create` is not idempotent, so the real
        # `git push origin v<version>` was then rejected, and forcing it made the
        # workflow die here with "release already exists". The same
        # non-idempotency broke "Re-run failed jobs": a transient failure in the
        # final upload restarted from step one and died here, leaving a fully
        # signed release the channel permanently did not point at.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          TAG: ${{ steps.meta.outputs.tag }}
          TARBALL: ${{ steps.meta.outputs.tarball }}
          SHA: ${{ steps.pack.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          NOTES=$(mktemp)
          {
            printf 'Channel: `%s` · sha256 `%s`\n\n' "$CHANNEL" "$SHA"
            printf 'Signed with cosign keyless, bound to `%s`.\n' "$REPOSITORY"
            if [ "$CHANNEL" = "dev" ]; then
              printf '\n> **Development build.** Built outside the official repository, so its\n'
              printf '> signing identity differs and production devices reject it by design.\n'
              printf '> `bitcoind` IS bundled (six aarch64 flavours) until it moves\n'
              printf '> to separate on-demand packages.\n'
            fi
          } > "$NOTES"

          PRERELEASE=""
          [ "$CHANNEL" != "stable" ] && PRERELEASE="--prerelease"

          gh release create "$TAG" $PRERELEASE \
            --title "Apollo ${VERSION}" \
            --notes-file "$NOTES" \
            --target "${GITHUB_SHA}" \
            "$TARBALL" "${TARBALL}.sig" "${TARBALL}.pem" \
            "apollo-${VERSION}-manifest.json"

      - name: Point the channel at this release
        # Tag pushes only. On a workflow_dispatch the cosign certificate carries
        # …/release.yml@refs/heads/<branch>, while a device's trust regexp — root
        # owned, deliberately not overridable from source.conf — requires
        # @refs/tags/v. So a dry run that moved the pointer would give the whole
        # fleet a 40 MB download that every device is guaranteed to reject at
        # signature verification, and the channel would stay poisoned until
        # someone pushed a real tag.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -Eeuo pipefail
          # What a device actually polls. A release under a fixed tag gives the
          # channel manifest a URL that never changes, so the device asks one
          # well-known address instead of having to discover releases first.
          # If hosting later moves to updates.futurebit.io, that is a config
          # change on the device — the pipeline keeps publishing here.
          POINTER="channel-${CHANNEL}"

          if ! gh release view "$POINTER" >/dev/null 2>&1; then
            gh release create "$POINTER" --prerelease \
              --title "Channel: ${CHANNEL}" \
              --notes "Moving pointer to the latest ${CHANNEL} build. Not a release: the assets here are replaced on every build."
          fi

          # THE comparison, not a second one written to agree with it.
          #
          # This guard shipped comparing with `sort -V`, under a comment claiming
          # parity with the updater. sort -V ranks 2.3.0-rc1 ABOVE 2.3.0 — the
          # trap version_gt's own comment opens by warning about, and which
          # semver.js repeats — so the first rc→final sequence would have frozen
          # the channel: workflow green, artifact signed, pointer never moved, no
          # device ever offered it. Sourcing the updater makes agreement
          # structural instead of aspirational.
          # The comparison and nothing else. Sourcing backend/update itself also
          # applied `set -Eeuo pipefail` to the rest of this step and ran that
          # script's top-level code — /dev/urandom, /etc/apollo/update.conf, a
          # state dir the runner does not have — so any future addition to it
          # would have silently changed how releases are published.
          # shellcheck disable=SC1091
          source backend/lib/version.sh

          # stderr, and never called from inside a command substitution: `$( )`
          # captures stdout, so an `::error::` written there landed in the
          # variable instead of the log and the step failed with nothing said
          # about why — on a transient 5xx during a release, which is precisely
          # when the maintainer needs to be told.
          die_step() { echo "::error::$*" >&2; exit 1; }

          read_pointer() {
            # Absent is not the same as unreadable. A first release legitimately
            # has no pointer; a rate limit or a 5xx must not be read as one, or
            # the guard silently disables itself on exactly the runs where two
            # releases are in flight.
            if ! gh release view "$POINTER" >/dev/null 2>&1; then
              printf ''
              return 0
            fi
            rm -f current-channel.json
            # An unreadable pointer is not an absent one: swallowing the failure
            # disabled the guard on exactly the runs where two releases are in
            # flight. Reported through the exit status, because the caller reads
            # this function's stdout.
            gh release download "$POINTER" --pattern "${CHANNEL}.json" \
              --output current-channel.json || return 1
            jq -r '.version // empty' current-channel.json
          }

          # Compare-and-set, retried, because releases are only serialised per
          # tag: two tags pushed a minute apart — the working pattern this branch
          # was built with — run concurrently, and `--clobber` is last-writer-
          # wins. A single check before the upload cannot prevent an older run
          # overwriting a newer one afterwards. Re-reading after the write does:
          # whoever is newest keeps re-uploading until it sticks, and whoever is
          # older stops as soon as it sees something newer.
          for attempt in 1 2 3; do
            CURRENT_POINTER="$(read_pointer)" \
              || die_step "could not read the current ${CHANNEL} pointer"
            if [ -n "$CURRENT_POINTER" ] && [ "$CURRENT_POINTER" != "$VERSION" ] \
               && ! version_gt "$VERSION" "$CURRENT_POINTER"; then
              echo "::notice::channel ${CHANNEL} points at ${CURRENT_POINTER}, which is not older than ${VERSION} — leaving it alone"
              exit 0
            fi

            gh release upload "$POINTER" "${CHANNEL}.json" --clobber
            sleep 5

            SETTLED="$(read_pointer)" \
              || die_step "could not re-read the ${CHANNEL} pointer after writing"
            if [ "$SETTLED" = "$VERSION" ]; then
              echo "channel manifest now points at ${VERSION}"
              exit 0
            fi
            echo "::warning::pointer became ${SETTLED} after our write (attempt ${attempt})"
          done
          die_step "could not settle the ${CHANNEL} pointer on ${VERSION}"
